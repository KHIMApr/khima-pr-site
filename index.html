<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHIMA 홍보위 발행물 아카이브</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--font-sans); color:var(--ink); background:var(--bg);
        word-break:keep-all; overflow-wrap:break-word; padding-bottom:60px; }
  header{ background:var(--c-header-grad); color:#fff; padding:34px 24px 28px; }
  .wrap{ max-width:860px; margin:0 auto; padding:0 16px; }
  header h1{ font-size:28px; letter-spacing:-.5px; }
  header p{ margin-top:8px; font-size:15px; opacity:.85; }
  .controls{ display:flex; flex-wrap:wrap; gap:10px; margin:22px auto 6px; max-width:860px; padding:0 16px; }
  .controls input{ flex:1 1 240px; font-size:16px; padding:11px 14px; border:1px solid var(--line);
        border-radius:var(--radius-chip); font-family:inherit; }
  .controls button{ font-size:14px; font-weight:700; padding:9px 14px; border-radius:999px;
        border:1px solid var(--c-accent-line); background:var(--surface); color:var(--c-accent);
        cursor:pointer; font-family:inherit; }
  .controls button.on{ background:var(--khima-navy-700); color:#fff; border-color:var(--khima-navy-900); }
  .list{ display:flex; flex-direction:column; gap:14px; margin-top:16px; }
  .item{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-box);
        padding:18px 20px; box-shadow:0 2px 8px rgba(13,77,116,.06); }
  .item .row1{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .no{ font-size:14px; font-weight:800; color:var(--c-accent); background:var(--c-accent-bg);
        border:1px solid var(--c-accent-line); padding:3px 10px; border-radius:999px; }
  .status{ font-size:12px; font-weight:800; padding:3px 9px; border-radius:5px; }
  .status.배포{ background:#e6f4ea; color:#1e7e34; }
  .status.확인필요{ background:var(--c-key-bg); color:var(--c-key); }
  .title{ font-size:20px; font-weight:800; margin-top:8px; }
  .title.todo{ color:var(--faint); font-weight:600; font-style:normal; }
  .meta{ margin-top:8px; font-size:14px; color:var(--sub); line-height:1.55; }
  .tags{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag{ font-size:12px; font-weight:700; color:var(--khima-navy-700); background:var(--bg);
        border:1px solid var(--line); padding:2px 9px; border-radius:999px; }
  .empty{ text-align:center; color:var(--faint); padding:40px 0; font-size:15px; }
  .note{ max-width:860px; margin:26px auto 0; padding:0 16px; font-size:13px; color:var(--faint); line-height:1.6; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>KHIMA 홍보위 발행물 아카이브</h1>
    <p>정책 카드뉴스·이슈페이퍼 호수별 목록 — 데이터는 <b>archive-data.js</b>에서 관리</p>
  </div>
</header>

<div class="controls">
  <input id="q" type="search" placeholder="제목·출처·비고 검색…">
  <button data-f="전체" class="on">전체</button>
  <button data-f="배포">배포됨</button>
  <button data-f="확인 필요">확인 필요</button>
</div>
<div class="wrap"><div class="list" id="list"></div><div class="empty" id="empty" hidden>조건에 맞는 발행물이 없습니다.</div></div>
<p class="note">※ 이 페이지는 로컬 열람용 인덱스입니다. 제목이 "확인 필요"인 호수는 Notion DB·홈페이지 게시 내역과 대조해 <b>archive-data.js</b>에 기입하세요. 값을 추정해 채우지 않습니다(환각 통제 원칙).</p>

<script src="archive-data.js"></script>
<script>
  var state = { q:"", f:"전체" };
  var $list = document.getElementById("list"), $empty = document.getElementById("empty");

  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

  function render(){
    var rows = (window.KHIMA_ARCHIVE||[]).filter(function(it){
      if(state.f==="배포" && it.상태!=="배포") return false;
      if(state.f==="확인 필요" && it.상태!=="확인 필요") return false;
      if(state.q){
        var hay=[it.호수,it.제목,it.출처,it.비고,(it.태그||[]).join(" ")].join(" ").toLowerCase();
        if(hay.indexOf(state.q.toLowerCase())<0) return false;
      }
      return true;
    });
    $list.innerHTML = rows.map(function(it){
      var stCls = it.상태==="배포" ? "배포" : "확인필요";
      var title = it.제목 ? '<div class="title">'+esc(it.제목)+'</div>'
                          : '<div class="title todo">제목 확인 필요</div>';
      var meta = [];
      if(it.출처) meta.push("출처: "+esc(it.출처));
      if(it.산출물 && it.산출물.length) meta.push("산출물: "+esc(it.산출물.join(" · ")));
      if(it.비고) meta.push(esc(it.비고));
      var tags = (it.태그||[]).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join("");
      return '<div class="item"><div class="row1"><span class="no">'+esc(it.호수)+'</span>'+
             '<span class="status '+stCls+'">'+esc(it.상태)+'</span></div>'+ title +
             (meta.length?'<div class="meta">'+meta.join("<br>")+'</div>':"") +
             (tags?'<div class="tags">'+tags+'</div>':"") + '</div>';
    }).join("");
    $empty.hidden = rows.length>0;
  }

  document.getElementById("q").addEventListener("input", function(e){ state.q=e.target.value; render(); });
  document.querySelectorAll(".controls button").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".controls button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on"); state.f=b.dataset.f; render();
    });
  });
  render();
</script>
</body>
</html>
